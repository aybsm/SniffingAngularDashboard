<div class="unavailable">
  <mat-card class="unavailable__card">
    <mat-icon class="unavailable__icon">cloud_off</mat-icon>

    <h1>API Tidak Bisa Diakses</h1>
    <p>
      Server saat ini nggak bisa dihubungi. Ini bisa terjadi karena server
      sedang down, koneksi jaringan bermasalah, atau sedang ada maintenance.
    </p>
    <p class="unavailable__contact-hint">
      Kalau masalah ini berlanjut, mohon hubungi creator:
    </p>

    <div class="unavailable__links">
      <a mat-stroked-button [href]="'mailto:' + contact.email">
        <mat-icon>mail</mat-icon>
        Email
      </a>
      <a mat-stroked-button [href]="contact.github" target="_blank" rel="noopener">
        <mat-icon>code</mat-icon>
        GitHub
      </a>
      <a mat-stroked-button [href]="contact.linkedin" target="_blank" rel="noopener">
        <mat-icon>business_center</mat-icon>
        LinkedIn
      </a>
    </div>

    <button mat-flat-button color="primary" (click)="retry()">
      <mat-icon>refresh</mat-icon>
      Coba Lagi
    </button>
  </mat-card>
</div>
